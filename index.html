<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0a3d2e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="NS Bills"><link rel="apple-touch-icon" href="icon-192.png">
<title>NS Solar Energy & Electric Store</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mu:#66717f;--pr:#0b6e4f;--bd:#d9dee4;--rd:#d32020;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161b;--card:#1c232b;--tx:#e8edf2;--mu:#98a4b2;--bd:#2c3642;--pr:#2fb386}}
:root[data-theme="dark"]{--bg:#12161b;--card:#1c232b;--tx:#e8edf2;--mu:#98a4b2;--bd:#2c3642;--pr:#2fb386}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:70px}
header{background:#0a3d2e;color:#fff;padding:14px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.18)}
header h1{font-size:16px;margin:0}header small{opacity:.85}
main{padding:12px;max-width:560px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(16,24,40,.06)}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{padding:11px 14px;border:0;border-radius:8px;background:var(--pr);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.s{background:var(--bd);color:var(--tx)}button.w{width:100%;margin-top:10px}button.d{background:var(--rd)}
.row{display:flex;gap:8px}.row>*{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:12px 2px;font-size:12px}nav button.on{color:var(--pr);border-top:3px solid var(--pr)}
.it{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd);cursor:pointer}
.it:last-child{border:0}.mu{color:var(--mu);font-size:12px}.b{font-weight:700}
.tot{display:flex;justify-content:space-between;font-weight:700;padding:4px 0}
.msg{padding:8px;border-radius:8px;background:#fff3cd;color:#664d03;margin-top:8px;font-size:13px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px}
.box{background:var(--card);border-radius:12px;padding:12px;width:100%;max-width:380px}
video{width:100%;border-radius:8px;background:#000}
.rc{background:#fff;color:#000;padding:10px;border:1px dashed #999;position:relative;font-size:13px;margin:0 auto;width:100%;max-width:300px}
.rc.w80{max-width:380px}.rc h3{margin:0;text-align:center;font-size:15px}.rc small{display:block;text-align:center}
.rc hr{border:0;border-top:1px dashed #000;margin:6px 0}.rc .r{display:flex;justify-content:space-between;gap:6px;padding:2px 0}
.ur{font-family:"Noto Naskh Arabic",serif;direction:rtl}.rc .t{text-align:center;font-weight:700}
.stamp{position:absolute;right:10px;bottom:52px;border:3px solid var(--rd);color:var(--rd);font-weight:800;font-size:20px;padding:2px 12px;transform:rotate(-14deg);text-align:center;line-height:1.2;border-radius:6px;opacity:.9}
.stamp span{display:block;font-family:"Noto Naskh Arabic",serif;font-size:14px}
.rc{border:0;border-radius:10px;padding:16px 14px;font-size:12px;box-shadow:0 2px 10px rgba(0,0,0,.18);max-width:290px}
.rc .sn{text-align:center;font-weight:800;font-size:16px;letter-spacing:.4px;text-transform:uppercase;line-height:1.2}
.rc .sa{text-align:center;font-size:11px;color:#555;margin:4px 0 10px}
.rc .ttl{display:flex;justify-content:space-between;align-items:center;background:#111;color:#fff;border-radius:6px;padding:5px 8px;font-size:11px;letter-spacing:.8px;font-weight:700}
.rc .mt{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed #bbb}
.rc .l{font-size:10.5px;color:#666}.rc .l.ur{direction:rtl;text-align:left}.rc .r{padding:7px 0;border-bottom:1px dotted #ccc;align-items:center}
.rc .v{font-weight:700;text-align:right;word-break:break-all}
.rc .amt2{display:flex;justify-content:space-between;align-items:center;border:2px solid #111;border-radius:8px;padding:8px 10px;margin:10px 0}
.rc .big2{font-size:19px;font-weight:800}
.rc .stw{text-align:center;padding:4px 0 10px}.rc .stamp{position:static;display:inline-block;transform:rotate(-8deg)}
.rc .ft{text-align:center;font-size:11px;color:#555;border-top:1px dashed #bbb;padding-top:8px;margin-top:6px}
button.big{padding:16px;font-size:17px;border-radius:12px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pr);border-color:transparent}
.rc .amt{display:flex;justify-content:space-between;align-items:center;border-top:2px solid #000;border-bottom:2px solid #000;padding:6px 0;margin:6px 0;font-size:16px;font-weight:800}
.rc .r span:first-child{color:#444}.rc h3{font-size:16px;letter-spacing:.3px;text-transform:uppercase}
.rep{background:#fff;color:#111;padding:18px;border-radius:8px;font-size:12px}
.rep table{width:100%;border-collapse:collapse;margin-bottom:10px}.rep td,.rep th{padding:5px 6px;border-bottom:1px solid #ddd;text-align:left}
.rep th{background:#0a3d2e;color:#fff;font-size:11px}.rep .n{text-align:right;white-space:nowrap}.rep h4{margin:12px 0 4px;color:#0a3d2e}
.rep .rh{display:flex;justify-content:space-between;gap:10px;border-bottom:3px solid #0a3d2e;padding-bottom:8px;margin-bottom:10px}.rep h2{margin:0;color:#0a3d2e;font-size:18px}.rep .rt{text-align:right}
.rep .sm{display:flex;gap:10px}.rep .sm div{flex:1;background:#eef5f1;padding:8px;border-radius:6px}.rep .sm span{display:block;color:#555}.rep .sm b{font-size:16px}
.rep .two{display:flex;gap:16px}.rep .two>div{flex:1}.rep .tr td{font-weight:700;border-top:2px solid #111}
@media print{body.pr>*:not(#rov){display:none!important}body.pr #rov{position:static;background:none;padding:0;display:block}body.pr .box{box-shadow:none;padding:0;max-width:none!important;background:none}body.pr .noprint{display:none}.rc{border:0;box-shadow:none}.rep{padding:0}}
</style><script src="html5-qrcode.min.js"></script></head>
<body>
<div id="app"></div>
<script>
const K='ns_bills_v1';
let db={users:[],bills:[],seq:1000,paper:'58'};
try{const s=localStorage.getItem(K);if(s)db=Object.assign(db,JSON.parse(s))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}};
const SHOP='NS Solar Energy & Electric Store',ADDR='Ghalla Mandi Chowk, Chak Jhumra, Faisalabad',PH='03022999000';
const COS=['FESCO','SNGPL','PTCL','Internet'];
let adding=false,me=null,tab='collect',dup=null,rd=today(),rm=today().slice(0,7),q='',stream=null;
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'Rs '+Number(n).toLocaleString('en-US');
const $=id=>document.getElementById(id);
const sum=a=>a.reduce((t,b)=>t+Number(b.amt),0);
const app=$('app');

function login(){
  const first=!db.users.length;
  app.innerHTML=`<header><h1>${SHOP}</h1><small>${first?'First-time setup: create admin':'Staff login'}</small></header><main><div class="card">
  ${first?`<label>Your name</label><input id="ln">`:`<label>User</label><select id="lu">${db.users.map(u=>`<option>${esc(u.name)}</option>`).join('')}</select>`}
  <label>PIN (4+ digits)</label><input id="lp" type="password" inputmode="numeric">
  <div id="le"></div><button class="w" onclick="doLogin(${first})">${first?'Create admin':'Login'}</button></div></main>`;
}
function doLogin(first){
  const pin=$('lp').value.trim();
  if(pin.length<4){$('le').innerHTML='<div class="msg">PIN must be at least 4 digits</div>';return}
  if(first){const n=$('ln').value.trim();if(!n){$('le').innerHTML='<div class="msg">Enter name</div>';return}
    me={name:n,pin,admin:true};db.users.push(me);save();}
  else{const u=db.users.find(u=>u.name===$('lu').value&&u.pin===pin);
    if(!u){$('le').innerHTML='<div class="msg">Wrong PIN</div>';return}me=u}
  try{localStorage.setItem('ns_sess',me.name)}catch(e){}
  tab='collect';shell();
}
function logout(){me=null;try{localStorage.removeItem('ns_sess')}catch(e){}login()}
function shell(){
  const T=[['collect','Collect'],['daily','Daily'],['monthly','Monthly'],['find','Find'],['set','Settings']];
  app.innerHTML=`<header><div class="row" style="align-items:center"><div><h1>${SHOP}</h1><small>User: ${esc(me.name)}</small></div><div style="flex:0"><button class="s" onclick="logout()">Logout</button></div></div></header>
  <main id="v"></main><nav>${T.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="tab='${t[0]}';adding=false;shell()">${t[1]}</button>`).join('')}</nav>`;
  ({collect:vCollect,daily:vDaily,monthly:vMonthly,find:vFind,set:vSet})[tab]();
}
function vCollect(){
  if(adding)return vForm();
  const a=db.bills.filter(b=>b.paid===today());
  $('v').innerHTML=`<button class="w big" onclick="adding=true;vCollect()">+ New Bill</button>
  <div class="card" style="margin-top:12px"><div class="mu">TODAY</div><div class="tot"><span>${a.length} bills</span><span>${money(sum(a))}</span></div></div>
  <div class="card"><div class="mu" style="margin-bottom:4px">Recent receipts</div>${list(a.slice(-10))}</div>`;
}
function vForm(){
  $('v').innerHTML=`<div class="card"><button class="s" onclick="adding=false;vCollect()">&larr; Back</button><label>Company</label><select id="co" onchange="fill()">${COS.map(c=>`<option>${c}</option>`).join('')}</select>
  <label>Reference / Consumer no</label><div class="row"><input id="rf" inputmode="numeric" style="flex:3" onchange="fill()"><button class="s" style="flex:1" onclick="scan()">Scan</button></div>
  <div class="row"><div><label>Bill amount (Rs)</label><input id="am" type="number" inputmode="decimal"></div><div><label>Due date</label><input id="bd" type="date"></div></div>
  <div id="ms"></div><button class="w" id="sv" onclick="saveBill()">Receive payment &amp; print receipt</button></div>
  <p class="mu">USB scanner: tap the Reference field and scan. Camera: tap Scan.</p>`;
  dup=null;
}
let h5=null;
async function scan(){
  const ov=document.createElement('div');ov.className='ov';ov.id='sc';
  ov.innerHTML='<div class="box"><div id="qr" style="width:100%;min-height:160px"></div><div id="hq" style="display:none"></div><div id="sm" class="mu" style="margin:8px 0">Hold the phone 15-20 cm from the barcode, keep it flat and in good light. It scans automatically, or tap Capture.</div><button class="w" onclick="snap()">Capture now</button><button class="s w" onclick="stopScan()">Close (type manually)</button></div>';
  document.body.appendChild(ov);
  try{
    if(!window.Html5Qrcode)throw 'NoLib';
    const F=Html5QrcodeSupportedFormats;h5=new Html5Qrcode('qr',{verbose:false,formatsToSupport:[F.CODE_128,F.CODE_39,F.ITF,F.EAN_13,F.QR_CODE],experimentalFeatures:{useBarCodeDetectorIfSupported:true}});
    await h5.start({facingMode:'environment',width:{ideal:1920},height:{ideal:1080}},{fps:15,qrbox:(w,h)=>({width:Math.floor(w*.95),height:Math.floor(Math.min(h*.6,w*.5))})},txt=>{if(!h5)return;stopScan();applyScan(txt)},()=>{});
  }catch(e){
    const m=String(e&&e.name||e);const h=h5;h5=null;if(h){try{h.clear()}catch(x){}}
    const why=m.includes('NotAllowed')?'Camera permission is blocked here. Allow camera for this site in Chrome settings, or open the page directly in Chrome.':'Live camera could not start.';
    $('sm').innerHTML=why+'<label style="display:block;margin-top:8px;padding:12px;border-radius:8px;background:var(--pr);color:#fff;text-align:center;font-weight:600">Take photo instead<input type="file" accept="image/*" capture="environment" hidden onchange="photo(this)"></label>';
  }
}
async function snap(){
  const v=document.querySelector('#qr video');if(!v||!v.videoWidth)return;
  $('sm').textContent='Reading...';
  const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);
  let val=null;
  try{if('BarcodeDetector' in window){const r=await new BarcodeDetector().detect(c);if(r.length)val=r[0].rawValue}}catch(e){}
  try{if(!val){const b=await new Promise(r=>c.toBlob(r,'image/png'));val=(await new Html5Qrcode('hq').scanFile(new File([b],'f.png',{type:'image/png'}),false)).decodedText}}catch(e){}
  if(val){stopScan();applyScan(val)}else $('sm').textContent='Not readable. Move a little closer or farther, keep the barcode flat in good light, then tap Capture again.';
}
async function photo(inp){
  const f=inp.files[0];if(!f)return;
  $('sm').textContent='Reading barcode...';let v=null;
  try{if('BarcodeDetector' in window){const r=await new BarcodeDetector().detect(await createImageBitmap(f));if(r.length)v=r[0].rawValue}}catch(e){}
  try{if(!v&&window.Html5Qrcode){v=(await new Html5Qrcode('hq').scanFile(f,false)).decodedText}}catch(e){}
  if(v){stopScan();applyScan(v);return}
  $('sm').innerHTML='Could not read it. Try a closer, sharper photo, or type the number.<label style="display:block;margin-top:8px;padding:12px;border-radius:8px;background:var(--pr);color:#fff;text-align:center;font-weight:600">Take photo again<input type="file" accept="image/*" capture="environment" hidden onchange="photo(this)"></label>';
}
function stopScan(){const h=h5;h5=null;const done=()=>{const o=$('sc');if(o)o.remove()};
  if(h){h.stop().catch(()=>{}).then(()=>{try{h.clear()}catch(e){}done()})}else done()}
function saveBill(){
  const co=$('co').value,ref=$('rf').value.trim(),amt=parseFloat($('am').value);
  if(!ref||!(amt>0)){$('ms').innerHTML='<div class="msg">Reference and a valid amount are required</div>';return}
  const key=co+'|'+ref+'|'+amt;
  const old=db.bills.find(b=>b.co===co&&b.ref===ref&&b.amt==amt);
  if(old&&dup!==key){dup=key;$('ms').innerHTML=`<div class="msg">This bill was already paid on ${old.paid} by ${esc(old.by)}. Tap again to save anyway.</div>`;return}
  const d=new Date(),b={id:++db.seq,co,ref,cust:'',amt,bdate:$('bd').value,paid:today(),time:d.toTimeString().slice(0,5),by:me.name};
  db.bills.push(b);save();adding=false;vCollect();showRc(b.id);
}
function showRc(id){
  const b=db.bills.find(x=>x.id==id);if(!b)return;
  const r=(e,u,v)=>`<div class="r"><div><div class="l">${e}</div><div class="l ur">${u}</div></div><div class="v">${esc(v)}</div></div>`;
  const o=document.createElement('div');o.className='ov';o.id='rov';
  o.innerHTML=`<div class="box"><div class="rc ${db.paper=='80'?'w80':''}">
  <div class="sn">${SHOP}</div><div class="sa">${ADDR}<br>${PH}</div>
  <div class="ttl"><span>PAYMENT RECEIPT</span><span class="ur">ادائیگی کی رسید</span></div>
  <div class="mt"><div><div class="l">Receipt no</div><b>#${b.id}</b></div><div style="text-align:right"><div class="l">Date &amp; time</div><b>${b.paid} &middot; ${b.time}</b></div></div>
  ${r('Company','کمپنی',b.co)}${r('Reference no','ریفرنس نمبر',b.ref)}${b.bdate?r('Due date','آخری تاریخ',b.bdate):''}
  <div class="amt2"><div><div class="l">Amount paid</div><div class="l ur">ادا کی گئی رقم</div></div><div class="big2">${money(b.amt)}</div></div>
  <div class="stw"><div class="stamp">PAID<span>ادا شدہ</span></div></div>
  ${r('Collected by','وصول کنندہ',b.by)}
  <div class="ft">Thank you for your payment<br><span class="ur">ادائیگی کا شکریہ</span></div></div>
  <div class="row noprint" style="margin-top:10px"><button onclick="doPrint('r')">Print</button><button class="s" onclick="$('rov').remove()">Close</button></div></div>`;
  document.body.appendChild(o);
}
const list=a=>a.length?a.slice().reverse().map(b=>`<div class="it" onclick="showRc(${b.id})"><div><div class="b">${esc(b.co)} · ${esc(b.ref)}</div><div class="mu">#${b.id} · ${b.paid} ${b.time} · by ${esc(b.by)}</div></div><div class="b">${money(b.amt)}</div></div>`).join(''):'<p class="mu">No records</p>';
function split(a,k){const m={};a.forEach(b=>{m[b[k]]=(m[b[k]]||0)+Number(b.amt)});return Object.keys(m).map(x=>`<div class="tot"><span>${esc(x)}</span><span>${money(m[x])}</span></div>`).join('')}
function applyScan(x){
  let m=String(x).match(/^E(\d{14})(\d{4})(\d{6})(.{9})(.{9})/);
  if(m){
    $('co').value='FESCO';$('rf').value=m[1];
    const a=Number(m[4].replace(/^0+(?=.)/,'')),d=m[3];
    $('bd').value='20'+d.slice(4,6)+'-'+d.slice(2,4)+'-'+d.slice(0,2);
    if(a>0){$('am').value=a;$('ms').innerHTML=''}else{$('am').value='';$('ms').innerHTML='<div class="msg">This FESCO bill has no payable amount (credit or zero).</div>'}
    fill();return}
  m=String(x).match(/^0300(\d{12})\d{10}(\d{6})\d{18}$/);
  if(m){$('co').value='SNGPL';$('rf').value=m[1].slice(1);const d=m[2];
    $('bd').value='20'+d.slice(4,6)+'-'+d.slice(2,4)+'-'+d.slice(0,2);
    $('ms').innerHTML='<div class="msg">Account and due date filled. Enter the amount from the bill.</div>';return}
  m=String(x).match(/REF NO:\s*(\d+)/);
  $('rf').value=m?m[1]:x;fill();
}
function fill(){}
function doPrint(kind){let s=$('pg');if(!s){s=document.createElement('style');s.id='pg';document.head.appendChild(s)}
  s.textContent=kind=='a4'?'@page{size:A4;margin:12mm}':'@page{margin:0}';
  document.body.classList.add('pr');try{window.print()}catch(e){}setTimeout(()=>document.body.classList.remove('pr'),800)}
function showRep(title,sub,a){
  const t=k=>{const m={};a.forEach(b=>{m[b[k]]=(m[b[k]]||0)+Number(b.amt)});return Object.keys(m).sort().map(x=>`<tr><td>${esc(x)}</td><td class="n">${money(m[x])}</td></tr>`).join('')};
  const o=document.createElement('div');o.className='ov';o.id='rov';
  o.innerHTML=`<div class="box" style="max-width:820px"><div class="rep"><div class="rh"><div><h2>${SHOP}</h2><div>${ADDR} &middot; ${PH}</div></div><div class="rt"><b>${title}</b><div>${sub}</div></div></div>
  <div class="sm"><div><span>Total bills</span><b>${a.length}</b></div><div><span>Total collected</span><b>${money(sum(a))}</b></div></div>
  <div class="two"><div><h4>By company</h4><table>${t('co')}</table></div><div><h4>By collector</h4><table>${t('by')}</table></div></div>
  <h4>Bill details</h4><div style="overflow-x:auto"><table><tr><th>#</th><th>Paid on</th><th>Company</th><th>Reference</th><th>Collected by</th><th class="n">Amount</th></tr>
  ${a.map(b=>`<tr><td>${b.id}</td><td>${b.paid} ${b.time}</td><td>${esc(b.co)}</td><td>${esc(b.ref)}</td><td>${esc(b.by)}</td><td class="n">${money(b.amt)}</td></tr>`).join('')}
  <tr class="tr"><td colspan="6">Total</td><td class="n">${money(sum(a))}</td></tr></table></div>
  <div style="margin-top:8px;color:#666">Printed on ${today()}</div></div>
  <div class="row noprint" style="margin-top:10px"><button onclick="doPrint('a4')">Print A4</button><button class="s" onclick="$('rov').remove()">Close</button></div></div>`;
  document.body.appendChild(o);
}
function vDaily(){
  const a=db.bills.filter(b=>b.paid===rd);
  $('v').innerHTML=`<div class="card"><label>Date</label><input type="date" value="${rd}" onchange="rd=this.value||today();vDaily()">
  <div class="tot" style="margin-top:10px"><span>Bills: ${a.length}</span><span>Total: ${money(sum(a))}</span></div><div class="mu">By company</div>${split(a,'co')}<div class="mu">By collector</div>${split(a,'by')}<button class="w" onclick="showRep('Daily Report',rd,db.bills.filter(b=>b.paid===rd))">View / Print A4 report</button></div><div class="card">${list(a)}</div>`;
}
function vMonthly(){
  const a=db.bills.filter(b=>b.paid.slice(0,7)===rm);
  $('v').innerHTML=`<div class="card"><label>Month</label><input type="month" value="${rm}" onchange="rm=this.value||today().slice(0,7);vMonthly()">
  <div class="tot" style="margin-top:10px"><span>Bills: ${a.length}</span><span>Total: ${money(sum(a))}</span></div><div class="mu">By company</div>${split(a,'co')}<div class="mu">By collector</div>${split(a,'by')}<div class="mu">By day</div>${split(a,'paid')}<button class="w" onclick="showRep('Monthly Report',rm,db.bills.filter(b=>b.paid.slice(0,7)===rm))">View / Print A4 report</button></div><div class="card">${list(a)}</div>`;
}
function vFind(){
  $('v').innerHTML=`<div class="card"><label>Search reference or receipt no</label><input id="fq" value="${esc(q)}" oninput="q=this.value;fres()"></div><div class="card" id="fr"></div>`;fres();
}
function fres(){
  const s=q.trim().toLowerCase();
  $('fr').innerHTML=s?list(db.bills.filter(b=>[b.ref,String(b.id),b.co].join(' ').toLowerCase().includes(s))):'<p class="mu">Type to search. Tap a result to see its receipt.</p>';
}
function vSet(){
  $('v').innerHTML=`<div class="card"><label>Receipt paper</label><select onchange="db.paper=this.value;save()"><option value="58" ${db.paper=='58'?'selected':''}>58 mm</option><option value="80" ${db.paper=='80'?'selected':''}>80 mm</option></select></div>
  ${me.admin?`<div class="card"><b>Staff</b>${db.users.map(u=>`<div class="it" style="cursor:default"><span>${esc(u.name)}${u.admin?' (admin)':''}</span>${u.name!==me.name?`<button class="d" onclick="delU('${esc(u.name)}')">Remove</button>`:''}</div>`).join('')}
  <label>New staff name</label><input id="nn"><label>PIN</label><input id="np" inputmode="numeric"><div id="ue"></div><button class="w" onclick="addU()">Add staff</button></div>`:''}
  <div class="card"><b>Export / Import</b><p class="mu">Export: copy the text and keep it safe (Notes/WhatsApp). Import: paste it below.</p>
  <button class="s w" onclick="exp()">Show export data</button><textarea id="ex" rows="5" placeholder="Export data appears here / paste data to import"></textarea>
  <div class="row"><button class="s" onclick="cp()">Copy</button><button onclick="imp()">Import</button></div><div id="ie"></div></div>`;
}
function addU(){const n=$('nn').value.trim(),p=$('np').value.trim();
  if(!n||p.length<4||db.users.some(u=>u.name===n)){$('ue').innerHTML='<div class="msg">Unique name and 4+ digit PIN required</div>';return}
  db.users.push({name:n,pin:p});save();vSet()}
function delU(n){db.users=db.users.filter(u=>u.name!==n);save();vSet()}
function exp(){$('ex').value=JSON.stringify({users:db.users,bills:db.bills,seq:db.seq,paper:db.paper})}
function cp(){const t=$('ex');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){}}
function imp(){
  try{const d=JSON.parse($('ex').value);if(!Array.isArray(d.bills)||!Array.isArray(d.users))throw 0;
    const ids=new Set(db.bills.map(b=>b.co+'|'+b.ref+'|'+b.id));let n=0;
    d.bills.forEach(b=>{const k=b.co+'|'+b.ref+'|'+b.id;if(!ids.has(k)){db.bills.push(b);n++}});
    d.users.forEach(u=>{if(!db.users.some(x=>x.name===u.name))db.users.push(u)});
    db.seq=Math.max(db.seq,d.seq||0,...db.bills.map(b=>b.id));save();
    $('ie').innerHTML=`<div class="msg">Imported ${n} new bills</div>`;
  }catch(e){$('ie').innerHTML='<div class="msg">Invalid data</div>'}
}
try{const s=localStorage.getItem('ns_sess');if(s)me=db.users.find(u=>u.name===s)||null}catch(e){}
me?shell():login();
</script><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){})</script></body></html>
